name: Go CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Push events to matching v*, i.e. v20.15.10
      - 'charm/v[0-9]+\.[0-9]+\.[0-9]+'
    paths:
      - '.github/workflows/**.yml'
      - 'charm/**'
      - 'pkg/**'
      - 'examples/**'
      - 'go.*'
      - '*.go'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/**.yml'
      - 'charm/**'
      - 'pkg/**'
      - 'examples/**'
      - 'go.*'
      - '*.go'

jobs:

  root_module:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    with:
      code_coverage: true
      min_test_coverage_percent: 100
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  charm_module:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    with:
      code_coverage: true
      min_test_coverage_percent: 100
      working_directory: charm
      disable-version-bumping: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  charm_module_tidy:
    name: Charm module tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify module metadata is tidy
        working-directory: charm
        run: go mod tidy -diff
